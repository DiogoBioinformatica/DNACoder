syntax = "proto3";

package dnacoder;

service SequenceService {
  rpc AnalyzeSequences(AnalyzeRequest) returns (stream AnalyzeReply);
}

message AnalyzeRequest {
  bool include_bases = 1;
  repeated uint64 ids = 2;
  uint32 limit = 3;
  uint32 offset = 4;
  string name_like = 5;
}

message AnalyzeReply {
  uint64 id = 1;
  string name = 2;
  uint64 length = 3;
  uint64 checksum = 4;     // exemplo de resultado
  double gccontent = 5;   // exemplo de resultado
  string bases = 6;        // opcional (pode ser grande!)
  string encoded_dump = 7; // <-- texto do show()/to_string()
  bytes packed = 8;        // <-- opcional: binário compacto real
}
